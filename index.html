<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Hand Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            transform: scaleX(-1);
            opacity: 0.7;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 0.8rem; color: #aaa; }
        .highlight { color: #00ffff; font-weight: bold; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Core Particle System</h1>
        <p>🖐 <strong>1 Hand:</strong> Move Center</p>
        <p>👐 <strong>2 Hands:</strong> Control <span class="highlight">SIZE</span> (Expand/Contract)</p>
        <p>👌 <strong>Pinch:</strong> Change Shape</p>
        <p id="status" style="margin-top:10px; color:#fff;">Initializing...</p>
    </div>

    <div id="loading">Starting Vision...</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const BASE_SCALE = 1.0;
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.03); // Dark fog for depth

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // Base shape positions
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        // Initial Layout
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
            sizes[i] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Shader to handle the "Glow"
        const material = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: new THREE.TextureLoader().load("https://assets.codepen.io/127738/dotTexture.png") }
            },
            vertexShader: `
                attribute float size;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    // Scale size by distance
                    gl_PointSize = size * (250.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                varying vec3 vColor;
                void main() {
                    gl_FragColor = vec4(vColor, 1.0);
                    // Texture alpha mapping
                    gl_FragColor = gl_FragColor * texture2D(pointTexture, gl_PointCoord);
                    if (gl_FragColor.a < 0.1) discard;
                }
            `,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            vertexColors: true
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- SHAPE LOGIC ---
        const shapes = {
            sphere: () => {
                const arr = [];
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const r = 2.0 * Math.cbrt(Math.random());
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    arr.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                }
                return arr;
            },
            galaxy: () => {
                const arr = [];
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 2.5 * Math.random();
                    const spiral = angle + radius * 3.0; // Twist
                    const x = Math.cos(spiral) * radius;
                    const y = (Math.random() - 0.5) * 0.5; // Flattened
                    const z = Math.sin(spiral) * radius;
                    arr.push(x, y, z);
                }
                return arr;
            },
            cube: () => {
                const arr = [];
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    arr.push((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
                }
                return arr;
            }
        };

        const shapeKeys = Object.keys(shapes);
        let currentShapeIndex = 0;

        function updateShapeTargets() {
            const shapeName = shapeKeys[currentShapeIndex];
            const newPoints = shapes[shapeName]();
            for(let i=0; i<PARTICLE_COUNT; i++) {
                targetPositions[i*3] = newPoints[i*3];
                targetPositions[i*3+1] = newPoints[i*3+1];
                targetPositions[i*3+2] = newPoints[i*3+2];
            }
            document.getElementById('status').innerHTML = `Shape: <span class="highlight">${shapeName.toUpperCase()}</span>`;
        }
        
        // Initialize first shape
        updateShapeTargets();

        // --- HAND TRACKING ---
        let handCenter = { x: 0, y: 0 };
        let handSeparation = 1.0; // 1.0 = standard size
        let lastPinch = 0;
        let isPinching = false;

        const videoElement = document.getElementById('webcam');
        
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        // Enable tracking for 2 hands
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        hands.onResults((results) => {
            document.getElementById('loading').style.display = 'none';
            const detectedHands = results.multiHandLandmarks;

            if (detectedHands.length > 0) {
                // 1. Position Logic
                let xSum = 0, ySum = 0;
                
                // Calculate average position of all detected hands
                detectedHands.forEach(hand => {
                    xSum += hand[9].x; // Middle finger knuckle (stable center)
                    ySum += hand[9].y;
                });

                const avgX = xSum / detectedHands.length;
                const avgY = ySum / detectedHands.length;

                // Map to 3D world coords (smoothed)
                const targetX = (0.5 - avgX) * 10;
                const targetY = (0.5 - avgY) * 8;
                
                handCenter.x += (targetX - handCenter.x) * 0.1;
                handCenter.y += (targetY - handCenter.y) * 0.1;

                // 2. Scaling Logic (Two Hands)
                if (detectedHands.length === 2) {
                    const h1 = detectedHands[0][9]; // Hand 1 center
                    const h2 = detectedHands[1][9]; // Hand 2 center
                    
                    // Calculate distance
                    const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);
                    
                    // Map distance (0.1 to 0.8) to Scale (0.5 to 3.0)
                    const targetScale = Math.max(0.2, dist * 4.0);
                    handSeparation += (targetScale - handSeparation) * 0.1; // Smooth transition
                } else {
                    // Reset scale if only 1 hand
                    handSeparation += (1.0 - handSeparation) * 0.05;
                }

                // 3. Pinch Logic (Switch Shape)
                const hand = detectedHands[0];
                const pinchDist = Math.hypot(hand[8].x - hand[4].x, hand[8].y - hand[4].y);
                if(pinchDist < 0.04) {
                    if(!isPinching && Date.now() - lastPinch > 1000) {
                        isPinching = true;
                        lastPinch = Date.now();
                        currentShapeIndex = (currentShapeIndex + 1) % shapeKeys.length;
                        updateShapeTargets();
                    }
                } else {
                    isPinching = false;
                }
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const positionsAttr = geometry.attributes.position;
            const colorsAttr = geometry.attributes.color;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Current position
                const px = positionsAttr.getX(i);
                const py = positionsAttr.getY(i);
                const pz = positionsAttr.getZ(i);

                // Target Base Shape Position * Hand Scale + Hand Center
                const tx = (targetPositions[i * 3] * handSeparation) + handCenter.x;
                const ty = (targetPositions[i * 3 + 1] * handSeparation) + handCenter.y;
                const tz = (targetPositions[i * 3 + 2] * handSeparation);

                // Smooth Movement (Fluid lerp)
                // We use a slightly faster lerp (0.08) for responsiveness
                positionsAttr.setX(i, px + (tx - px) * 0.08);
                positionsAttr.setY(i, py + (ty - py) * 0.08);
                positionsAttr.setZ(i, pz + (tz - pz) * 0.08);

                // --- COLOR LOGIC: WHITE MID ---
                // Calculate distance of particle relative to the SYSTEM CENTER (not world center)
                // We compare current particle pos to handCenter
                const distFromCenter = Math.sqrt(
                    Math.pow(px - handCenter.x, 2) + 
                    Math.pow(py - handCenter.y, 2) + 
                    Math.pow(pz, 2)
                );

                // Core Logic:
                // If distance is small (< 1), color is PURE WHITE.
                // If distance is large, fade to Cyan/Blue.
                
                const maxDist = 3.5 * handSeparation; // The fade edge scales with hand size
                let brightness = 1.0 - (distFromCenter / maxDist);
                if (brightness < 0) brightness = 0;

                // Color Mixing:
                // R, G, B
                // Core: 1.0, 1.0, 1.0 (White)
                // Edge: 0.0, 0.5, 1.0 (Cyan/Blue)
                
                // We maintain high Green/Blue to keep it white/cyan. Red drops off first.
                const r = Math.pow(brightness, 3); // Red drops off fast (leaving blue/green)
                const g = Math.pow(brightness, 1.5); // Green drops medium
                const b = 1.0; // Blue stays high

                colorsAttr.setXYZ(i, r, g + 0.2, b); // +0.2 adds a base glow
            }

            positionsAttr.needsUpdate = true;
            colorsAttr.needsUpdate = true;
            
            // Slow rotation for 3D effect
            particles.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
